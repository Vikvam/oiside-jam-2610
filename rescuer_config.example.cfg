; Copy to rescuer_config.cfg (gitignored) and fill in.
[rescuer]
; Local dev proxy (proxy/rescuer_proxy.py) — used by "Claude Haiku (local proxy)"
proxy_url="http://127.0.0.1:8765/rescuer"
; Real endpoint — used by "API endpoint".
; format="anthropic" -> Anthropic Messages API (x-api-key header)
; format="simple"    -> POST {system, prompt}, expects {text} (same as the proxy), Bearer key
format="anthropic"
url="https://api.anthropic.com/v1/messages"
key=""
model="claude-haiku-5-5"
